<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Uygulama Yönlendiricisi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <p style="text-align:center; margin-top:50px; font-family:sans-serif;">Uygulamanıza yönlendiriliyorsunuz...</p>

    <script>
        var packageName = "com.azmessage";
        var githubDownloadUrl = "https://github.com/mehemmed988/AzMessage/releases/";

        var intentUrl = "intent://details?id=" + packageName + "#Intent;scheme=package;package=" + packageName + ";end;";
        
        var fallbackTimer = setTimeout(function() {
            window.location.href = githubDownloadUrl;
        }, 1500);

        window.location.href = intentUrl;

        window.addEventListener("blur", function() {
            clearTimeout(fallbackTimer);
        });
    </script>
</body>
</html>
