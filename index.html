<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AzMessage Yönlendirici</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            padding: 20px;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active {
            background-color: #1ebe5d;
        }
        p {
            color: #666;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>AzMessage</h2>
        <p id="infoText">Uygulamaya yönlendiriliyorsunuz...</p>
        <a href="azapp://open" id="openAppBtn" class="btn">Uygulamada Aç</a>
    </div>

    <script>
        var customSchemeUrl = "azapp://open";
        var urlParams = new URLSearchParams(window.location.search);
        var redirectPath = urlParams.get('redirect');

        if (redirectPath) {
            var cleanPath = redirectPath.replace(/^\/+|\/+$/g, '');
            var pathSegments = cleanPath.split("/");
            var targetIndex = -1;

            for (var i = 0; i < pathSegments.length; i++) {
                var segment = pathSegments[i].toLowerCase();
                if (segment === "user" || segment === "users") {
                    if (i + 1 < pathSegments.length) {
                        targetIndex = i + 1;
                        break;
                    }
                }
            }

            if (targetIndex !== -1) {
                var username = pathSegments[targetIndex];
                if (username) {
                    customSchemeUrl += "?user=" + encodeURIComponent(username);
                    document.getElementById("infoText").innerText = "@" + username + " profiline yönlendiriliyorsunuz...";
                }

                var extraParams = [];
                for (var j = targetIndex + 1; j < pathSegments.length; j++) {
                    if (pathSegments[j]) {
                        extraParams.push(encodeURIComponent(pathSegments[j]));
                    }
                }

                if (extraParams.length > 0) {
                    customSchemeUrl += "&extra=" + extraParams.join(",");
                }
            }
        }

        document.getElementById("openAppBtn").href = customSchemeUrl;

        window.onload = function() {
            window.location.href = customSchemeUrl;
        };
    </script>
</body>
</html>
