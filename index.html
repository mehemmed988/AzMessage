<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Uygulama Yönlendiricisi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <p style="text-align:center; margin-top:50px; font-family:sans-serif;">Uygulamanıza yönlendiriliyorsunuz...</p>

    <script>
        var packageName = "com.azmessage";
        var githubDownloadUrl = "https://github.com/mehemmed988/AzMessage/releases/";

        // Doğrudan paket adına odaklanan ve tarayıcının uygulamayı bulmasını sağlayan Intent formatı
        var intentUrl = "intent://#Intent;package=" + packageName + ";action=android.intent.action.VIEW;category=android.intent.category.DEFAULT;end;";
        
        var fallbackTimer = setTimeout(function() {
            window.location.href = githubDownloadUrl;
        }, 1500);

        window.location.href = intentUrl;

        window.addEventListener("blur", function() {
            clearTimeout(fallbackTimer);
        });
    </script>
</body>
</html>
