<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AzMessage Yönlendirici</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            padding: 20px;
        }
        .btn {
            display: none;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active {
            background-color: #1ebe5d;
        }
        p {
            color: #666;
            font-size: 15px;
        }
        .error-msg {
            color: #e53935;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>AzMessage</h2>
        <p id="infoText">Kullanıcı kontrol ediliyor...</p>

        <a href="#" id="openAppBtn" class="btn">Uygulamada Aç</a>
    </div>

    <!-- Firebase SDK (Compat sürümleri) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Verdiğin bilgilerle yapılandırıldı
        var firebaseConfig = {
            apiKey: "AIzaSyDPZ1vmj3jQCEfgdC35DHnVRW63IwXPEQQ",
            databaseURL: "https://azmessage-1998-default-rtdb.firebaseio.com",
            appId: "1:989356500260:android:0f8079499c77b3f15bbfb1"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        var customSchemeUrl = "azapp://open";
        var urlParams = new URLSearchParams(window.location.search);
        var redirectPath = urlParams.get('redirect');
        var targetUsername = null;

        if (redirectPath) {
            var pathSegments = redirectPath.split("/");
            var userIndex = pathSegments.indexOf("user");
            
            if (userIndex !== -1 && pathSegments.length > userIndex + 1) {
                targetUsername = pathSegments[userIndex + 1];
            }
        }

        var infoText = document.getElementById("infoText");
        var openAppBtn = document.getElementById("openAppBtn");

        if (targetUsername) {
            infoText.innerText = "@" + targetUsername + " aranıyor...";

            // Android uygulandaki mantığın bire aynısı (orderByChild & equalTo)
            db.ref('users').orderByChild('username').equalTo(targetUsername).once('value')
                .then(function(snapshot) {
                    if (snapshot.exists()) {
                        customSchemeUrl += "?user=" + encodeURIComponent(targetUsername);
                        openAppBtn.href = customSchemeUrl;
                        openAppBtn.style.display = "inline-block";
                        infoText.innerText = "@" + targetUsername + " profiline yönlendiriliyorsunuz...";

                        // Kullanıcı var, uygulamayı aç
                        window.location.href = customSchemeUrl;
                    } else {
                        // Kullanıcı yok, yönlendirme yok, hata mesajı göster
                        infoText.className = "error-msg";
                        infoText.innerText = "@" + targetUsername + " adında bir kullanıcı bulunamadı!";
                    }
                })
                .catch(function(error) {
                    infoText.className = "error-msg";
                    infoText.innerText = "Kullanıcı kontrolü yapılırken bir hata oluştu.";
                    console.error("Firebase Hatası:", error);
                });
        } else {
            openAppBtn.href = customSchemeUrl;
            openAppBtn.style.display = "inline-block";
            infoText.innerText = "Uygulamaya yönlendiriliyorsunuz...";
            window.location.href = customSchemeUrl;
        }
    </script>
</body>
</html>
