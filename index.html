<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AzMessage Yönlendirici</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            padding: 20px;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active {
            background-color: #1ebe5d;
        }
        p {
            color: #666;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>AzMessage</h2>
        <p id="infoText">Uygulamaya yönlendiriliyorsunuz...</p>
        <a href="azapp://open" id="openAppBtn" class="btn" style="display: none;">Uygulamada Aç</a>
    </div>

    <script>
        var customSchemeUrl = "azapp://open";
        var urlParams = new URLSearchParams(window.location.search);
        var redirectPath = urlParams.get('redirect');
        var isValid = false;

        if (redirectPath) {
            var cleanPath = redirectPath.replace(/^\/+|\/+$/g, '');
            var pathSegments = cleanPath.split("/");

            if (pathSegments.length >= 2 && pathSegments[0].toLowerCase() === "user") {
                var username = pathSegments[1];
                if (username) {
                    customSchemeUrl += "?user=" + encodeURIComponent(username);
                    document.getElementById("infoText").innerText = "@" + username + " profiline yönlendiriliyorsunuz...";
                    document.getElementById("openAppBtn").href = customSchemeUrl;
                    document.getElementById("openAppBtn").style.display = "inline-block";
                    isValid = true;

                    var extraParams = [];
                    for (var j = 2; j < pathSegments.length; j++) {
                        if (pathSegments[j]) {
                            extraParams.push(encodeURIComponent(pathSegments[j]));
                        }
                    }

                    if (extraParams.length > 0) {
                        customSchemeUrl += "&extra=" + extraParams.join(",");
                        document.getElementById("openAppBtn").href = customSchemeUrl;
                    }
                }
            }
        }

        if (!isValid) {
            document.getElementById("infoText").innerText = "Hatalı URL!";
            document.getElementById("openAppBtn").style.display = "none";
        } else {
            window.onload = function() {
                window.location.href = customSchemeUrl;
            };
        }
    </script>
</body>
</html>
