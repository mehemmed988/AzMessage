<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Uygulama Yönlendiricisi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        .btn:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>AzMessage'a Yönlendiriliyorsunuz</h2>
    <p>Uygulama otomatik açılmadıysa aşağıdaki butona tıklayın:</p>
    
    <a href="#" id="openAppBtn" class="btn">Uygulamayı Aç</a>

    <script>
        var packageName = "com.azmessage";
        var githubDownloadUrl = "https://github.com/mehemmed988/AzMessage/releases/";

        var intentUrl = "intent://#Intent;package=" + packageName + ";action=android.intent.action.VIEW;category=android.intent.category.DEFAULT;end;";

        document.getElementById("openAppBtn").addEventListener("click", function(e) {
            e.preventDefault();

            var fallbackTimer = setTimeout(function() {
                window.location.href = githubDownloadUrl;
            }, 1500);

            window.addEventListener("blur", function() {
                clearTimeout(fallbackTimer);
            });

            window.location.href = intentUrl;
        });
    </script>
</body>
</html>
